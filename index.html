<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>VALDEZ Fresh and Clean</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #fff;
      background: url('WhatsApp Image 2026-05-17 at 17.32.38.jpeg') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      padding-bottom: 80px; /* Espacio para que el botón flotante no tape contenido */
    }
    h1 {
      text-align: center;
      background: rgba(0,0,0,0.7);
      padding: 15px;
      margin: 0;
    }
    .category {
      margin: 20px;
      background: rgba(0,0,0,0.6);
      border-radius: 10px;
      padding: 15px;
    }
    .carousel {
      display: flex;
      overflow-x: auto;
      scroll-behavior: smooth;
    }
    /* Ocultar barra de desplazamiento en el carrusel */
    .carousel::-webkit-scrollbar {
      display: none;
    }
    .carousel {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
    .item {
      flex: 0 0 auto;
      width: 220px;
      margin: 10px;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .item h3 {
      margin: 0;
      font-size: 1.1em;
    }
    .item p {
      font-size: 0.9em;
    }
    .select-btn {
      margin-top: 8px;
      padding: 6px 10px;
      background: #ff9800;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .cantidad {
      margin-top: 5px;
      font-size: 0.9em;
    }

    /* Nuevos estilos para el control de cantidad */
    .quantity-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-top: 10px;
    }
    .quantity-btn {
      padding: 5px 10px;
      background: #ff9800;
      color: #fff;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
    }
    .quantity-input {
      width: 50px;
      text-align: center;
      padding: 4px;
      border-radius: 3px;
      border: 1px solid #ccc;
      background: #fff;
      color: #000;
    }

    /* Estilos para el botón flotante */
    #carrito-flotante {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #25D366; /* Color WhatsApp */
      color: #fff;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      text-decoration: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      z-index: 1000;
      transition: transform 0.2s;
    }

    #carrito-flotante:active {
      transform: scale(0.9);
    }

    #contador-carrito {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #ff4444;
      color: white;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 14px;
      display: none; /* Se oculta si es 0 */
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* Ocultamos el botón de pedir original */
    #pedido {
      display: none;
    }

    /* Estilos para el botón de menú de tres rayitas y la ventana modal */
    #menu-toggle {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 30px;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      z-index: 1001;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      max-width: 300px;
      width: 80%;
      border: 1px solid #ff9800;
    }
    .modal-content h2 {
      margin-top: 0;
      color: #ff9800;
    }
    .modal-content a {
      color: #25D366;
      text-decoration: none;
      display: block;
      margin: 10px 0;
    }
    .modal-content a.email-link {
      color: #00bcd4;
    }

  </style>
</head>
<body>
  <button id="menu-toggle">☰</button>
  <h1>🧼 VALDEZ Fresh and Clean</h1>
  <div id="menu"></div>
    
  <a id="carrito-flotante" href="#" target="_blank">
    🛒
    <div id="contador-carrito">0</div>
  </a>

  <a id="pedido" href="#" target="_blank">📲 Pedir</a>

  <div id="modal-contacto" class="modal">
    <div class="modal-content">
      <h2>Desarrollador</h2>
      <p><strong>Antonio Itriago</strong></p>
      <p>Analista, Programador</p>
      <a href="https://wa.me/584122525407" target="_blank">📲 WhatsApp: +584122525407</a>
      <a class="email-link" href="mailto:antoniojitriagoc@gmail.com">✉️ antoniojitriagoc@gmail.com</a>
    </div>
  </div>

  <script>
    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRrVKUJHVqKlHPJLiBuxFN3-XbCUd6RJskLvzdRtSM9iX-U76EyGgqL4W4S-nnBJ0pkEyIN9v3oHwMz/pub?output=tsv";
    const numeroWhatsApp = "584127027665"; // Número de Valdez Fresh and Clean

    let seleccionados = {};

    async function loadMenu() {
      try {
        const res = await fetch(sheetUrl);
        const text = await res.text();
        const rows = text.trim().split("\n").map(r => r.split("\t"));
        
        const headers = rows[0].map(h => h.trim());
        const data = rows.slice(1);

        const categorias = {
          "Productos de Limpieza": []
        };

        data.forEach(row => {
          const itemRaw = {};
          headers.forEach((h, i) => itemRaw[h] = row[i]);

          if (itemRaw["Producto"]) {
            const item = {
              name: itemRaw["Producto"],
              priceDetal: itemRaw["Precio Al Detal"],
              priceMayor: itemRaw["Precio Al Mayor"],
              description: "Calidad y pureza garantizada."
            };
            categorias["Productos de Limpieza"].push(item);
          }
        });

        const menuDiv = document.getElementById("menu");
        menuDiv.innerHTML = "";

        Object.keys(categorias).forEach(cat => {
          if (categorias[cat].length === 0) return;

          const catDiv = document.createElement("div");
          catDiv.className = "category";
          catDiv.innerHTML = `<h2>${cat}</h2><div class="carousel"></div>`;
          const carousel = catDiv.querySelector(".carousel");

          categorias[cat].forEach(item => {
            const div = document.createElement("div");
            div.className = "item";
            div.innerHTML = `
              <h3>${item.name}</h3>
              <p>${item.description}</p>
              <p><strong>Detal: $${item.priceDetal}</strong></p>
              <p><small>Mayor: $${item.priceMayor} (+20L)</small></p>
              <div class="quantity-control">
                <button class="quantity-btn minus-btn">-</button>
                <input type="number" class="quantity-input" value="0" min="0">
                <button class="quantity-btn plus-btn">+</button>
              </div>
            `;
            
            const minusBtn = div.querySelector(".minus-btn");
            const plusBtn = div.querySelector(".plus-btn");
            const inputField = div.querySelector(".quantity-input");

            plusBtn.addEventListener("click", () => {
              let val = parseInt(inputField.value) || 0;
              val++;
              inputField.value = val;
              actualizarItemSeleccionado(item, val);
            });

            minusBtn.addEventListener("click", () => {
              let val = parseInt(inputField.value) || 0;
              if (val > 0) {
                val--;
                inputField.value = val;
                actualizarItemSeleccionado(item, val);
              }
            });

            inputField.addEventListener("input", () => {
              let val = parseInt(inputField.value);
              if (isNaN(val) || val < 0) {
                val = 0;
                inputField.value = 0;
              }
              actualizarItemSeleccionado(item, val);
            });

            carousel.appendChild(div);
          });

          menuDiv.appendChild(catDiv);
        });
      } catch (err) {
        document.getElementById("menu").innerHTML = "Error cargando catálogo 😢";
        console.error(err);
      }
    }

    function actualizarItemSeleccionado(item, cantidad) {
      if (cantidad <= 0) {
        delete seleccionados[item.name];
      } else {
        seleccionados[item.name] = { item, cantidad };
      }
      actualizarPedido();
    }

    function actualizarPedido() {
      const carritoBtn = document.getElementById("carrito-flotante");
      const contadorDiv = document.getElementById("contador-carrito");
      const items = Object.values(seleccionados);
        
      const totalProductos = items.reduce((a, b) => a + b.cantidad, 0);
        
      if(totalProductos === 0) {
        carritoBtn.href = "#";
        contadorDiv.style.display = "none";
        return;
      }

      contadorDiv.textContent = totalProductos;
      contadorDiv.style.display = "flex";

      let totalFinal = 0;
      let detalle = "";

      items.forEach(i => {
        let precioAplicado = parseFloat(i.item.priceDetal);
        let tipoPrecio = "Detal";

        if (i.cantidad >= 20) {
          precioAplicado = parseFloat(i.item.priceMayor);
          tipoPrecio = "Mayor";
        }

        const subtotal = precioAplicado * i.cantidad;
        totalFinal += subtotal;
        detalle += `- ${i.item.name} ×${i.cantidad} (${tipoPrecio}: $${precioAplicado.toFixed(2)}) → $${subtotal.toFixed(2)}\n`;
      });

      const mensaje = `¡Hola! Quiero realizar un pedido a Valdez Fresh and Clean:\n\n${detalle}\n*TOTAL NETO:* $${totalFinal.toFixed(2)}\n\nPor favor, necesito confirmar el pedido y los detalles de entrega. ¡Gracias!`;

      const url = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensaje)}`;
      carritoBtn.href = url;
    }

    // Lógica para abrir y cerrar la ventana modal de contacto
    const btnMenu = document.getElementById("menu-toggle");
    const modalContacto = document.getElementById("modal-contacto");

    btnMenu.addEventListener("click", () => {
      modalContacto.style.display = "flex";
    });

    modalContacto.addEventListener("click", (e) => {
      if (e.target === modalContacto) {
        modalContacto.style.display = "none";
      }
    });

    loadMenu();
  </script>
</body>
</html>
