<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Gabui.Express</title>
    <style>
        /* [Se mantienen todos los estilos CSS anteriores] */
        /* ==================================== */
        /* ESTILOS CSS BASE */
        /* ==================================== */
        body { 
            font-family: 'Arial', sans-serif; 
            /* --- FONDO DE PANTALLA --- */
            background-image: url('A vibrant and appeti.png'); 
            background-size: cover; 
            background-attachment: fixed; 
            background-repeat: no-repeat; 
            background-color: #333;
            margin: 0; 
            padding: 20px; 
            color: #333;
        }
        .main-container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1, h2 { 
            text-align: center; 
            color: #d9534f;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
        }
        
        /* --- ESTILOS DEL ENCABEZADO Y LOGO --- */
        .brand-header {
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-bottom: 20px; 
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 10px;
        }
        .brand-logo {
            height: 50px; 
            margin-right: 10px; 
            vertical-align: middle; 
        }
        .brand-name {
            font-size: 2.2em; 
            font-weight: bold;
            color: #d9534f; 
            margin: 0; 
        }
        /* Estilos de Carrito en el Encabezado */
        .header-carrito { 
            display: flex; 
            justify-content: flex-end; 
            align-items: center; 
            padding: 10px 0; 
            font-weight: bold;
        }
        #contador-carrito { 
            background: #d9534f; 
            color: white; 
            border-radius: 50%; 
            padding: 4px 8px; 
            font-weight: bold; 
            font-size: 12px; 
            margin-left: 5px; 
        }

        /* --- ESTILOS DEL CARRUSEL DE CATEGORÍAS --- */
        #carrusel-categorias, #detalle-carrito {
            background-color: rgba(255, 255, 255, 0.95); 
            border-radius: 8px;
            padding: 15px; 
            margin-top: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            min-height: 200px;
        }
        .categoria-pagina {
            display: none;
            width: 100%;
        }
        .categoria-pagina.activa {
            display: block;
        }
        .categoria-pagina h3 {
            text-align: center;
            color: #333;
            border-bottom: 2px solid #ffc107;
            padding-bottom: 5px;
            margin: 0 0 15px 0;
            font-size: 1.5em;
        }
        
        /* Controles de navegación del carrusel de categorías */
        .nav-categoria-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            z-index: 20;
            font-size: 18px;
            border-radius: 5px;
            transition: background-color 0.2s;
        }
        .nav-categoria-btn:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
        #prevCategoriaBtn { left: 5px; }
        #nextCategoriaBtn { right: 5px; }
        #carrusel-categorias.loading-state {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            color: #666;
        }

        /* --- ESTILOS DEL MENÚ ITEM CON IMAGEN --- */
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dashed #eee;
        }
        .menu-item:last-child {
            border-bottom: none;
        }
        .menu-item-info {
            flex-grow: 1;
            padding-right: 10px;
            display: flex;
            align-items: center;
        }
        .item-thumb {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            margin-right: 10px;
            border: 1px solid #ddd;
        }
        .item-text {
            flex-grow: 1;
        }
        .item-text strong {
            display: block;
            font-size: 1.1em;
            color: #d9534f;
        }
        .item-text span {
            font-size: 0.9em;
            color: #666;
        }
        
        /* Controles de cantidad (Añadir/Quitar) */
        .item-carrito-controls {
             display: flex; 
             align-items: center;
             min-width: 100px;
        }
        .item-carrito-controls button {
            background-color: #d9534f;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 5px;
            font-weight: bold;
        }
        .item-carrito-controls span {
            font-weight: bold;
            padding: 0 5px;
            min-width: 15px;
            text-align: center;
        }
        /* Botón Añadir para ítems sin cantidad */
        .btn-add {
            background-color: #5cb85c !important; 
            padding: 8px 12px !important;
            border-radius: 4px !important;
            width: auto !important;
            height: auto !important;
            font-size: 1em !important;
            margin: 0;
        }

        /* --- VISTA DEL CARRO --- */
        #detalle-carrito ul { list-style: none; padding: 0; }
        .item-carrito { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px; 
            border-bottom: 1px dotted #eee; 
            padding-bottom: 5px; 
        }
        
        #btn-finalizar {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #25d366; 
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.2s;
        }
        #btn-finalizar:hover {
            background-color: #128c7e;
        }
        
        .footer-note {
            text-align: center; 
            font-size: 0.8em; 
            margin-top: 15px;
            color: white;
            text-shadow: 1px 1px 2px #333;
        }
    </style>
</head>
<body>

<div class="main-container">

    <div class="header-carrito">
        🛒 **Tu Carrito** <span id="contador-carrito">0</span>
    </div>
    
    <div class="brand-header">
        <img src="logo.png" alt="Logo Gabui Express" class="brand-logo">
        <h1 class="brand-name">Gabui.Express</h1>
    </div>

    <h2>Menú de Promociones</h2>
    <div id="carrusel-categorias" class="loading-state">
        Cargando menú desde Google Sheets...
        </div>

    <button id="prevCategoriaBtn" class="nav-categoria-btn" style="display:none;" onclick="cambiarCategoria(-1)">&#10094;</button>
    <button id="nextCategoriaBtn" class="nav-categoria-btn" style="display:none;" onclick="cambiarCategoria(1)">&#10095;</button>

    <hr style="border-top: 1px solid rgba(255,255,255,0.5);">
    
    <h2>📋 Tu Pedido Final</h2>
    <div id="detalle-carrito">
        <p>El carrito está vacío. Empieza a seleccionar tus ítems.</p>
    </div>

    <button id="btn-finalizar" onclick="consultarPrecios()">
        Enviar Pedido por WhatsApp
    </button>
    
    <p class="footer-note">
        *La Tasa BCV y el precio final de delivery serán confirmados al enviar el pedido.
    </p>

</div>

<script>
    // URL PÚBLICA DE TU GOOGLE SHEET EXPORTADA COMO CSV
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSTgXx3-FQGvkMoG88Bw8itDysLE2pQXDM1MJdJniy4z-NXyJqIE0BqPNfsBHlT0KFe6kzy77hqz-w6/pub?gid=0&single=true&output=csv';
    
    // TASA BCV ACTUALIZADA MANUALMENTE (16 de Noviembre de 2025)
    const TASA_BCV_HOY = 236.1650; 
    
    // NÚMERO DE WHATSAPP ACTUALIZADO
    const NUMERO_WHATSAPP = "584122525407"; 

    // SEPARADOR DE COLUMNAS (MANTENIDO en COMA, como pediste)
    const CSV_SEPARATOR = ',';

    let carrito = [];
    let productos = []; 
    let productosPorCategoria = {};
    let categoriasOrdenadas = [];
    let categoriaActualIndex = 0;
    
    const carruselContenedor = document.getElementById('carrusel-categorias');
    const secciones = {
        carrito: document.getElementById('detalle-carrito'),
        contador: document.getElementById('contador-carrito'),
        prevBtn: document.getElementById('prevCategoriaBtn'),
        nextBtn: document.getElementById('nextCategoriaBtn')
    };
    
    // ===========================================
    // FUNCIONES PRINCIPALES DE FETCH Y RENDERIZADO
    // ===========================================

    async function fetchDataAndRender() {
        try {
            const response = await fetch(CSV_URL);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            
            const csvText = await response.text();
            parseCSV(csvText);
            
            if (productos.length > 0) {
                agruparProductos();
                renderizarCarrusel();
                actualizarVistaCarrito();
                carruselContenedor.classList.remove('loading-state');
            } else {
                 carruselContenedor.innerHTML = '⚠️ Error: No se encontraron productos. Verifica que la hoja esté publicada correctamente y que las columnas sean correctas.';
            }

        } catch (error) {
            console.error("Error al cargar o parsear el CSV:", error);
            carruselContenedor.innerHTML = `⚠️ Error al cargar los datos: ${error.message}. Verifica el enlace y el formato de la hoja.`;
        }
    }
    
    function parseCSV(csv) {
        const lineas = csv.trim().split('\n');
        if (lineas.length === 0) return;

        // Limpiamos los encabezados de retornos de carro y los ponemos en mayúsculas
        const encabezados = lineas[0].replace(/\r/g, '').split(CSV_SEPARATOR).map(h => h.trim().toUpperCase());
        
        // Encontramos el índice de la columna PRECIO para aplicar la corrección de decimales
        const precioIndex = encabezados.indexOf('PRECIO');

        for (let i = 1; i < lineas.length; i++) {
            const valores = lineas[i].replace(/\r/g, '').split(CSV_SEPARATOR).map(v => v.trim());
            if (valores.length !== encabezados.length) continue; 

            let producto = {};
            for (let j = 0; j < encabezados.length; j++) {
                producto[encabezados[j]] = valores[j];
            }
            
            // --- CORRECCIÓN DE DECIMALES ---
            let precioProcesado = producto.PRECIO;
            // Si la columna PRECIO usa coma (,) como decimal, la reemplazamos por punto (.)
            if (precioIndex !== -1 && valores[precioIndex].includes(',')) {
                precioProcesado = valores[precioIndex].replace(',', '.');
            }
            // -------------------------------
            
            // Mapeo de columnas
            productos.push({
                id: producto.ID,
                nombre: producto.NOMBRE,
                precio: parseFloat(precioProcesado) || 0, // Usamos el precio procesado
                moneda: producto.MONEDA,
                categoria: producto.CATEGORIA, 
                descripcion: producto.DESCRIPCION || '', 
                imagenUrl: producto.IMAGENURL || '' 
            });
        }
    }
    
    function agruparProductos() {
        productosPorCategoria = productos.reduce((acc, p) => {
            if (p.categoria && p.id) {
                const categoriaKey = p.categoria.toUpperCase();
                if (!acc[categoriaKey]) {
                    acc[categoriaKey] = [];
                }
                acc[categoriaKey].push(p);
            }
            return acc;
        }, {});
        
        categoriasOrdenadas = Object.keys(productosPorCategoria).sort();

        // Muestra/Oculta los botones de navegación si hay más de 1 categoría
        if (categoriasOrdenadas.length > 1) {
            secciones.prevBtn.style.display = 'block';
            secciones.nextBtn.style.display = 'block';
        } else {
            secciones.prevBtn.style.display = 'none';
            secciones.nextBtn.style.display = 'none';
        }
    }

    // Función principal para renderizar el carrusel y la categoría activa
    function renderizarCarrusel() {
        carruselContenedor.innerHTML = '';
        
        if (categoriasOrdenadas.length === 0) {
            carruselContenedor.innerHTML = 'No hay categorías para mostrar. Verifica la columna "CATEGORIA" en tu hoja.';
            return;
        }

        const categoriaActual = categoriasOrdenadas[categoriaActualIndex];
        const productosDeCategoria = productosPorCategoria[categoriaActual];

        let categoriaHTML = `<div class="categoria-pagina activa">`;
        categoriaHTML += `<h3>${categoriaActual}</h3>`;
        
        productosDeCategoria.forEach(producto => {
            const id = producto.id;
            const item = carrito.find(p => p.id === id);
            
            let precioTexto = producto.moneda === '$' ? `$${producto.precio.toFixed(2)}` : `${producto.precio.toFixed(2)} ${producto.moneda}`;
            
            let controlesHTML;
            if (item) {
                controlesHTML = `
                    <div class="item-carrito-controls">
                        <button onclick="cambiarCantidad('${id}', -1)">-</button>
                        <span>${item.cantidad}</span>
                        <button onclick="cambiarCantidad('${id}', 1)">+</button>
                    </div>
                `;
            } else {
                controlesHTML = `<button class="btn-add" onclick="cambiarCantidad('${id}', 1)">➕ Añadir</button>`;
            }

            // Renderiza el ítem con imagen (si la URL existe)
            const imagenTag = producto.imagenUrl ? `<img src="${producto.imagenUrl}" alt="${producto.nombre}" class="item-thumb">` : '';

            categoriaHTML += `
                <div class="menu-item">
                    <div class="menu-item-info">
                        ${imagenTag}
                        <div class="item-text">
                            <strong>${producto.nombre} - ${precioTexto}</strong>
                            <span>${producto.descripcion}</span>
                        </div>
                    </div>
                    ${controlesHTML}
                </div>
            `;
        });

        categoriaHTML += '</div>';
        carruselContenedor.innerHTML = categoriaHTML;
    }

    // Función para cambiar de categoría en el carrusel
    function cambiarCategoria(delta) {
        let nuevoIndex = categoriaActualIndex + delta;
        
        if (nuevoIndex >= 0 && nuevoIndex < categoriasOrdenadas.length) {
            categoriaActualIndex = nuevoIndex;
        } else if (nuevoIndex < 0) {
            // Ir al final si se intenta ir hacia atrás desde el inicio
            categoriaActualIndex = categoriasOrdenadas.length - 1;
        } else if (nuevoIndex >= categoriasOrdenadas.length) {
            // Ir al inicio si se intenta ir hacia adelante desde el final
            categoriaActualIndex = 0;
        }
        renderizarCarrusel();
    }
    
    // Función para manejar la cantidad de productos en el carrito
    function cambiarCantidad(productoId, delta) {
        let itemIndex = carrito.findIndex(item => item.id === productoId);
        const productoAAgregar = productos.find(p => p.id === productoId);

        if (!productoAAgregar) return;
        
        if (itemIndex === -1) {
            if (delta > 0) {
                carrito.push({
                    ...productoAAgregar,
                    cantidad: delta
                });
            }
        } else {
            let nuevoCantidad = carrito[itemIndex].cantidad + delta;
            if (nuevoCantidad > 0) {
                carrito[itemIndex].cantidad = nuevoCantidad;
            } else {
                carrito.splice(itemIndex, 1);
            }
        }

        actualizarVistaCarrito();
        renderizarCarrusel(); 
    }
    
    function calcularTotalItems() {
      return carrito.reduce((total, item) => total + item.cantidad, 0);
    }

    // Función para actualizar el resumen del carrito
    function actualizarVistaCarrito() {
        const totalItems = calcularTotalItems();
        secciones.contador.textContent = totalItems;
        
        secciones.carrito.innerHTML = ''; 

        if (carrito.length === 0) {
            secciones.carrito.innerHTML = '<p>El carrito está vacío. Empieza a seleccionar tus ítems.</p>';
            return;
        }

        let contenidoHTML = '<ul>';
        let totalPagarUSD = 0;
        let totalPagarBS = 0;

        carrito.forEach(item => {
            let subtotal = item.precio * item.cantidad;
            let precioUnitario = item.moneda === '$' ? `$${item.precio.toFixed(2)}` : `${item.precio.toFixed(2)} ${item.moneda}`;
            let subtotalFormateado = item.moneda === '$' ? `$${subtotal.toFixed(2)}` : `${subtotal.toFixed(2)} ${item.moneda}`;

            if (item.moneda === '$') {
                totalPagarUSD += subtotal;
            } else if (item.moneda === 'BS') {
                totalPagarBS += subtotal;
            }
            
            contenidoHTML += `
                <li class="item-carrito">
                    <div class="item-carrito-info">
                        ${item.nombre} (${precioUnitario}) - Subtotal: <strong>${subtotalFormateado}</strong>
                    </div>
                    <div class="item-carrito-controls">
                        <button onclick="cambiarCantidad('${item.id}', -1)">-</button>
                        <span>${item.cantidad}</span>
                        <button onclick="cambiarCantidad('${item.id}', 1)">+</button>
                    </div>
                </li>
            `;
        });
        
        contenidoHTML += '</ul>';
        contenidoHTML += '<h4>Resumen de Totales:</h4>';
        if (totalPagarUSD > 0) {
            contenidoHTML += `<p>Total en USD: <strong>$${totalPagarUSD.toFixed(2)}</strong></p>`;
        }
        if (totalPagarBS > 0) {
            contenidoHTML += `<p>Total en BS (Sin Conversión): <strong>${totalPagarBS.toFixed(2)} BS</strong></p>`;
        }
        
        let totalGeneralBS = totalPagarBS + (totalPagarUSD * TASA_BCV_HOY);
        
        if (totalGeneralBS > 0) {
            contenidoHTML += `<p style="color: #007bff; font-weight: bold;">TOTAL GENERAL ESTIMADO (BS): ${totalGeneralBS.toFixed(2)} BS</p>`;
            contenidoHTML += `<p style="font-size: 0.8em; color: #666;">(Tasa BCV de hoy: ${TASA_BCV_HOY.toFixed(2)})</p>`;
        }
        
        secciones.carrito.innerHTML = contenidoHTML;
    }

    function consultarPrecios() {
        if (carrito.length === 0) {
            alert("¡El carrito está vacío! Por favor, añade productos antes de enviar el pedido.");
            return;
        }
        
        let mensaje = "¡Hola! Quiero hacer un pedido con Gabui.Express. Aquí está mi lista:\n\n";
        let totalUSD = 0;
        let totalBS = 0;

        carrito.forEach((item, index) => {
            let subtotal = item.precio * item.cantidad;

            if (item.moneda === '$') {
                totalUSD += subtotal;
                mensaje += `${index + 1}. ${item.cantidad}x ${item.nombre} - $${subtotal.toFixed(2)}\n`;
            } else if (item.moneda === 'BS') {
                totalBS += subtotal;
                mensaje += `${index + 1}. ${item.cantidad}x ${item.nombre} - ${subtotal.toFixed(2)} BS\n`;
            }
        });

        mensaje += "\n----------------------------------";
        mensaje += `\nTOTAL ESTIMADO EN USD: $${totalUSD.toFixed(2)}`;
        mensaje += `\nTOTAL ESTIMADO EN BS (sin convers. de $): ${totalBS.toFixed(2)} BS`;
        mensaje += `\n----------------------------------`;
        mensaje += `\n(Tasa BCV referencial para el cálculo: ${TASA_BCV_HOY.toFixed(2)})`;
        mensaje += `\n\nPor favor, confirmen el precio final, la tasa BCV del día y el costo de delivery. ¡Gracias!`;
        
        const mensajeCodificado = encodeURIComponent(mensaje);

        // Abrir WhatsApp en una nueva ventana/pestaña
        const urlWhatsApp = `https://api.whatsapp.com/send?phone=${NUMERO_WHATSAPP}&text=${mensajeCodificado}`;
        window.open(urlWhatsApp, '_blank');
        
        // Intentar cerrar la ventana/pestaña actual.
        setTimeout(() => {
            try {
                window.close();
            } catch (e) {
                // Falla silenciosa si el navegador lo impide
            }
        }, 500); 
    }

    document.addEventListener('DOMContentLoaded', () => {
        fetchDataAndRender();
    });
</script>
</body>
</html>
