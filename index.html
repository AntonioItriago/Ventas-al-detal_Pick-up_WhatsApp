<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>DondeJoseito FastFood</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #fff;
      background: url('assets/fondo-app.jpeg') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      padding-bottom: 80px; /* Espacio para que el botón flotante no tape contenido */
    }
    h1 {
      text-align: center;
      background: rgba(0,0,0,0.7);
      padding: 15px;
      margin: 0;
    }
    .category {
      margin: 20px;
      background: rgba(0,0,0,0.6);
      border-radius: 10px;
      padding: 15px;
    }
    .carousel {
      display: flex;
      overflow-x: auto;
      scroll-behavior: smooth;
    }
    /* Ocultar barra de desplazamiento en el carrusel */
    .carousel::-webkit-scrollbar {
      display: none;
    }
    .carousel {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
    .item {
      flex: 0 0 auto;
      width: 220px;
      margin: 10px;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .item h3 {
      margin: 0;
      font-size: 1.1em;
    }
    .item p {
      margin: 5px 0;
      font-size: 0.9em;
    }
    .item img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .select-btn {
      margin-top: 8px;
      padding: 6px 10px;
      background: #ff9800;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .cantidad {
      margin-top: 5px;
      font-size: 0.9em;
    }

    /* Estilos para el botón flotante */
    #carrito-flotante {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #25D366; /* Color WhatsApp */
      color: #fff;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      text-decoration: none;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      z-index: 1000;
      transition: transform 0.2s;
    }

    #carrito-flotante:active {
      transform: scale(0.9);
    }

    #contador-carrito {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #ff4444;
      color: white;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 14px;
      display: none; /* Se oculta si es 0 */
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* Ocultamos el botón de pedir original */
    #pedido {
      display: none;
    }

    /* Estilo de la botonera superior */
    .top-actions-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.5);
    }
    .acerca-de-btn {
      padding: 8px 15px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: 1px solid #ff9800;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9em;
    }
    .menu-contacto-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
      padding: 0 5px;
      line-height: 1;
    }

    /* Ventanas Modales Profesionales */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .modal-content {
      width: 90%;
      max-width: 400px;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      border: 1px solid #ff9800;
      position: relative;
    }
    /* Filtro oscuro interno para que los textos sobre la imagen sigan siendo legibles */
    .modal-inner {
      background: rgba(0, 0, 0, 0.75);
      padding: 20px;
      border-radius: 8px;
    }
    .modal-inner h2 {
      margin-top: 0;
      color: #ff9800;
    }
    .modal-inner p {
      font-size: 1.1em;
      line-height: 1.5;
    }
    .modal-inner a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }
    .modal-inner a:hover {
      color: #ff9800;
    }
    .close-modal-btn {
      margin-top: 15px;
      padding: 8px 20px;
      background: #ff4444;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🍔 DondeJoseito FastFood</h1>
  
  <div class="top-actions-container">
    <button class="acerca-de-btn" id="btn-acerca">ℹ rails Acerca de</button>
    <button class="menu-contacto-btn" id="btn-contacto">☰</button>
  </div>

  <div id="menu"></div>
  
  <a id="carrito-flotante" href="#" target="_blank">
    🛒
    <div id="contador-carrito">0</div>
  </a>

  <a id="pedido" href="#" target="_blank">📲 Pedir</a>

  <!-- Modal Acerca de -->
  <div class="modal-overlay" id="modal-acerca">
    <div class="modal-content" style="background: url('assets/fondo-acerca-de.jpeg') no-repeat center center; background-size: cover;">
      <div class="modal-inner">
        <h2>DondeJoseito FastFood</h2>
        <p>¡La mejor comida rápida que te encanta!</p>
        <button class="close-modal-btn" onclick="cerrarModal('modal-acerca')">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Modal Contacto Desarrollador -->
  <div class="modal-overlay" id="modal-contacto">
    <div class="modal-content" style="background: url('assets/fondo-acerca-de.jpeg') no-repeat center center; background-size: cover;">
      <div class="modal-inner">
        <h2>Desarrollador</h2>
        <p><strong>Analista Programador:</strong><br>Antonio Itriago</p>
        <p><strong>Teléfono:</strong><br><a href="https://wa.me/584122525407" target="_blank">📲 +584122525407</a></p>
        <p><strong>Email:</strong><br><a href="mailto:antoniojitriagoc@gmail.com">✉️ antoniojitriagoc@gmail.com</a></p>
        <button class="close-modal-btn" onclick="cerrarModal('modal-contacto')">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQCxfiHazYD630xd4zsBuUO4HV_Yzy0bpPz8DUSC4CXzuCCTRhNa4D49XuTLTUcUXci-Guv1Xl4tcQr/pub?gid=1078866454&single=true&output=tsv";
    const numeroWhatsApp = "584128380827"; // número en formato internacional

    let seleccionados = {};

    async function loadMenu() {
      try {
        const res = await fetch(sheetUrl);
        const text = await res.text();
        const rows = text.trim().split("\n").map(r => r.split("\t"));
        const headers = rows[0];
        const data = rows.slice(1);

        const categories = {};
        data.forEach(row => {
          const item = {};
          headers.forEach((h,i) => item[h] = row[i]);

          if(!categories[item.category]) categories[item.category] = [];
          categories[item.category].push(item);
        });

        const menuDiv = document.getElementById("menu");
        menuDiv.innerHTML = "";

        Object.keys(categories).forEach(cat => {
          const catDiv = document.createElement("div");
          catDiv.className = "category";
          catDiv.innerHTML = `<h2>${cat}</h2><div class="carousel"></div>`;
          const carousel = catDiv.querySelector(".carousel");

          categories[cat].forEach(item => {
            const div = document.createElement("div");
            div.className = "item";
            div.innerHTML = `
              <img src="assets/${item.image}" alt="${item.name}">
              <h3>${item.name}</h3>
              <p>${item.description}</p>
              <p><strong>${item.price} ${item.currency}</strong></p>
              <button class="select-btn">➕ Agregar</button>
              <div class="cantidad">Cantidad: 0</div>
            `;
            const btn = div.querySelector(".select-btn");
            const cantidadDiv = div.querySelector(".cantidad");

            btn.addEventListener("click", () => {
              if(!seleccionados[item.name]) seleccionados[item.name] = {item, cantidad:0};
              seleccionados[item.name].cantidad++;
              cantidadDiv.textContent = "Cantidad: " + seleccionados[item.name].cantidad;
              actualizarPedido();
            });

            carousel.appendChild(div);
          });

          menuDiv.appendChild(catDiv);
        });
      } catch (err) {
        document.getElementById("menu").innerHTML = "Error cargando menú 😢";
        console.error(err);
      }
    }

    function actualizarPedido() {
      const carritoBtn = document.getElementById("carrito-flotante");
      const contadorDiv = document.getElementById("contador-carrito");
      const items = Object.values(seleccionados);
      
      // Actualizar el contador flotante
      const totalProductos = items.reduce((a, b) => a + b.cantidad, 0);
      
      if(totalProductos === 0) {
        carritoBtn.href = "#";
        contadorDiv.style.display = "none";
        return;
      }

      contadorDiv.textContent = totalProductos;
      contadorDiv.style.display = "flex";

      let total = 0;
      let detalle = "";

      items.forEach(i => {
        const subtotal = parseFloat(i.item.price) * i.cantidad;
        total += subtotal;
        detalle += `- ${i.item.name} ×${i.cantidad} → ${subtotal.toFixed(2)} ${i.item.currency}\n`;
      });

      const mensaje = `¡Hola, Joseito! Quiero realizar un pedido:\n\n${detalle}\n*TOTAL ESTIMADO:* ${total.toFixed(2)} ${items[0].item.currency}\n\nPor favor, necesito confirmar el pedido, delivery y los detalles de pago. ¡Gracias!`;

      const url = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensaje)}`;
      carritoBtn.href = url;
    }

    // Funciones para controlar los Modales
    function abrirModal(id) {
      document.getElementById(id).style.display = "flex";
    }

    function cerrarModal(id) {
      document.getElementById(id).style.display = "none";
    }

    document.getElementById("btn-acerca").addEventListener("click", () => {
      abrirModal('modal-acerca');
    });

    document.getElementById("btn-contacto").addEventListener("click", () => {
      abrirModal('modal-contacto');
    });

    loadMenu();
  </script>
</body>
</html>
